name: Android Release

# 构建安卓版 APK 并上传到 GitHub Release（独立于 macOS 版的 Release）。
# 手动运行：Actions → Android Release → Run workflow；或推送 android-v* 标签。
# 目前使用 debug 签名（可侧载安装，不适合上架应用商店）。

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (protocol + mock WebSocket server)
        run: ./gradlew :core:test
      - name: Build APK
        run: ./gradlew :app:assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          TAG="android-v${VERSION}"
          APK="Shengjian-Android-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --target "${GITHUB_SHA}" \
              --title "声笺安卓版 ${VERSION}" \
              --notes "声笺安卓版 ${VERSION}：仅保留 Qwen3.8 LiveTranslate 云端实时翻译（麦克风 → WebSocket → 原文/译文字幕，可选译音播放），支持断线自动重连。需要 Android 8.0+ 与 LiveTranslate 专用 API Key。当前为 debug 签名 APK，请允许安装未知来源应用后侧载安装。"
          fi
