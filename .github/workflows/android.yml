name: Android

on:
  push:
    paths: ["android/**", "tests/mock_livetranslate_server.py", "scripts/check_android_apk.sh", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "tests/mock_livetranslate_server.py", "scripts/check_android_apk.sh", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (protocol + mock WebSocket server)
        run: ./gradlew :core:test
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      # Unsigned here (no keystore on PRs): checks that R8 and resource shrinking succeed and the size budget holds.
      - name: Build release APK (unsigned, R8)
        run: ./gradlew :app:assembleRelease
      - name: Check release APK size
        run: ../scripts/check_android_apk.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shengjian-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
